{% macro avatar(people, sid, name, cls='av') -%}
  {%- set p = people.get(sid) if people else None -%}
  {%- if p and p.avatar -%}<img class="{{ cls }}" src="{{ p.avatar }}" alt="" loading="lazy">
  {%- else -%}<span class="{{ cls }} ini">{{ (name or '?')[:1] }}</span>{%- endif -%}
{%- endmacro %}

{% macro tier(t, cls='') -%}
  <span class="tier {{ cls }}" title="{{ ('Seviye %d / 10' % t) if t else 'Henüz sıralamada değil (yeterli maç yok)' }}">
  {{- level_ring(t, 52 if 'big' in cls else 30) -}}</span>
{%- endmacro %}
