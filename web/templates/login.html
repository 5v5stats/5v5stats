{% extends "base.html" %}
{% block title %}Yönetici girişi{% endblock %}
{% block body %}
<div class="panel login">
  <h2>Yönetici girişi</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><label for="nm">Kullanıcı adı</label><br><input id="nm" type="text" name="name" autocomplete="username" autofocus style="width:100%" placeholder="admin"></p>
    <p><label for="pw">Şifre</label><br><input id="pw" type="password" name="password" autocomplete="current-password" style="width:100%"></p>
    <button class="btn primary">Giriş yap</button>
  </form>
  <p class="dim" style="font-size:12px;margin-bottom:0">Ana yönetici: kullanıcı adı <code>admin</code>, şifre <code>ADMIN_PASSWORD</code>.
    Diğer yöneticileri ana yönetici Yönetim sayfasından ekler.</p>
</div>
{% endblock %}
